<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login">
        <div class="login-logo">
            <a>
                <img src="https://assets.pokemon.com/static2/_ui/img/chrome/profile-navigation/profile-nav-signup.png" alt="Pokemon Logo">
            </a>
        </div>
    </div>

    <div class="top-section-1">
        <div class="options">
            <ul class="ul-top-section">
                <li class="pokemon-logo">
                    <a>
                        <img src="https://assets.pokemon.com/assets/cms2/img/misc/gus/buttons/logo-pokemon-79x45.png" alt="Pokemon Logo">
                    </a>
                </li>
                <li class="shop-logo">
                    <a>
                        <img src="https://assets.pokemon.com/assets/cms2/img/misc/gus/buttons/logo-pokemoncenter-79x45.png" alt="Pokemon Logo">
                    </a>
                </li>
                <li class="aboutus-logo">
                    <a>
                        <img src="https://assets.pokemon.com/assets/cms2/img/misc/gus/buttons/corporate-en.png" alt="Pokemon Logo">
                    </a>
                </li>
                <li class="pokemon-TCG-logo">
                    <a>
                        <img src="https://assets.pokemon.com/assets/cms2/img/misc/gus/promotions/tcg-175-en.png" alt="Pokemon Logo">
                    </a>
                </li>
                <li class="pokemon-legend-ZA-logo">
                    <a>
                        <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/misc/gus/promotions/pokemon-legends-z-a-176x50-en.png" alt="Pokemon Logo">
                    </a>
                </li>
                <li class="pokemon-forum-logo">
                    <a>
                        <img src="https://assets.pokemon.com/assets/cms2/img/misc/gus/promotions/community-forums-175x50-en.png" alt="Pokemon Logo">
                    </a>
                </li>
            </ul>

        </div>
    </div>
</body>
</html>
