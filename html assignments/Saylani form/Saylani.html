<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="top">
        <div class="img"></div>
        <div class="register">
            <h1>Registration Form-SMIT</h1>
            <h3>Service-Education-Registration</h3>
        </div>
    </div>

    <div class="table">
        <label for="user-country">Select Country</label>
        <select name="user-country" id="user-country">
            <option value="pakistan">Pakistan</option>
            <option value="india">India</option>
            <option value="afghanistan">Afghanistan</option>
            <option value="iran">Iran</option>
            <option value="china">China</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="uae">UAE</option>
            <option value="saudi-arabia">Saudi Arabia</option>
        </select>

        <label for="user-city">Select your city</label>
        <select name="user-city" id="user-city">
            <option value="karachi">Karachi</option>
            <option value="lahore">Lahore</option>
            <option value="islamabad">Islamabad</option>
            <option value="peshawar">Peshawar</option>
            <option value="quetta">Quetta</option>
            <option value="faisalabad">Faisalabad</option>
            <option value="multan">Multan</option>
            <option value="hyderabad">Hyderabad</option>
            <option value="sialkot">Sialkot</option>
        </select>

        <label for="user-gender">Select your gender</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <label for="user-course">Select your course</label>
        <select name="user-course" id="user-course">
            <option value="web-development">Web Development</option>
            <option value="mobile-app-development">Mobile App Development</option>
            <option value="data-science">Data Science</option>
            <option value="cyber-security">Cyber Security</option>
            <option value="digital-marketing">Digital Marketing</option>
            <option value="graphic-designing">Graphic Designing</option>
            <option value="ui-ux-designing">UI/UX Designing</option>
            <option value="cloud-computing">Cloud Computing</option>
            <option value="ai-ml">AI & ML</option>
        </select>

        <label for="user-name">Full Name</label>
        <input type="text" name="user-name" placeholder="Enter your full name">

        <label for="user-Father-name">Father name</label>
        <input type="text" name="user-Father-name" placeholder="Enter your father name">

        <label for="user-phone">Phone No.</label>
        <input type="text" name="user-phone" placeholder="Enter your phone number">

        <label for="user-email">Enter Email</label>
        <input type="email" name="user-email" placeholder="Enter your email">\

        <label for="user-CNIC">Enter CNIC</label>
        <input type="text" name="user-CNIC" placeholder="Enter your CNIC">

        <label for="user-father-CNIC">Enter father CNIC</label>
        <input type="text" name="user-father-CNIC" placeholder="Enter your father CNIC">

        <label for="User-DOB">Date of birth</label>
        <input type="date" name="user-DOB" placeholder="Enter your date of birth">

        <label for="user-last-Qualification">Last Qualification</label>
        <input type="text" name="user-last-Qualification" placeholder="Enter your last qualification">

        <label for="User-address">Address</label>
        <input type="text" name="user-address" placeholder="Enter your address">

        <label for="User-Pic">Picture</label>
        <input type="file" name="user-Pic">
    </div>
</body>

</html>
