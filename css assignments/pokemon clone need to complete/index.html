<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokemon clone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-section">
      <div class="top-section-1">
        <div class="options-section-1">
          <ul class="ul-top-section-1">
            <li class="pokemon-logo">
              <a>
                <img
                  src="https://assets.pokemon.com/assets/cms2/img/misc/gus/buttons/logo-pokemon-79x45.png"
                  alt="Pokemon Logo"
                />
              </a>
            </li>
            <li class="shop-logo">
              <a>
                <img
                  src="https://assets.pokemon.com/assets/cms2/img/misc/gus/buttons/logo-pokemoncenter-79x45.png"
                  alt="Pokemon Logo"
                />
              </a>
            </li>
            <li class="aboutus-logo">
              <a>
                <img
                  src="https://assets.pokemon.com/assets/cms2/img/misc/gus/buttons/corporate-en.png"
                  alt="Pokemon Logo"
                />
              </a>
            </li>
            <li class="pokemon-TCG-logo">
              <a>
                <img
                  src="https://assets.pokemon.com/assets/cms2/img/misc/gus/promotions/tcg-175-en.png"
                  alt="Pokemon Logo"
                />
              </a>
            </li>
            <li class="pokemon-legend-ZA-logo">
              <a>
                <img
                  src="https://www.pokemon.com/static-assets/content-assets/cms2/img/misc/gus/promotions/pokemon-legends-z-a-176x50-en.png"
                  alt="Pokemon Logo"
                />
              </a>
            </li>
            <li class="pokemon-forum-logo">
              <a>
                <img
                  src="https://assets.pokemon.com/assets/cms2/img/misc/gus/promotions/community-forums-175x50-en.png"
                  alt="Pokemon Logo"
                />
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="top-section-2">
        <div class="options-section-2">
          <ul class="ul-top-section-2">
            <li class="Home">Home</li>
            <li class="pokedex">pokedex</li>
            <li class="video-games-apps">video games & apps</li>
            <li class="TCG">TCG</li>
            <li class="animation">animation</li>
            <li class="events">events</li>
            <li class="news">news</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="grid-section-1">
      <div class="actual-image-section-1">
        <div class="child-of-all-sec" id="first"></div>
        <div class="child-of-all-sec" id="second">
          <div class="second-card-img"></div>
          <div class="second-card-text">
            <h2>The World of Pokémon’s 2025 Year in Review</h2>
          </div>
        </div>
        <div class="child-of-all-sec" id="third"></div>
        <div class="child-of-all-sec" id="forth"></div>
        <div class="child-of-all-sec" id="fifth"></div>
        <div class="child-of-all-sec" id="sixth"></div>
      </div>
    </div>
    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
  </body>
</html>
